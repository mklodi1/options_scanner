name: Daily scan

on:
  schedule:
    - cron: "30 21 * * 1-5"   # weekdays 21:30 UTC = after the US close (5:30pm EDT / 4:30pm EST)
  workflow_dispatch:           # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write              # lets the job commit the new snapshot

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate models
        run: python test_models.py   # job stops here if any model test fails

      - name: Run scan
        run: python snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          git diff --cached --quiet || git commit -m "Daily snapshot $(date -u +%F)"
          git push
